<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What the agent does</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:  #f5f5f5;
    --color-ink:    #2d3142;
    --color-muted:  #4f5d75;
    --color-soft:   #7a8399;
    --color-accent: #2563EB;
    --color-accent-tint: rgba(37,99,235,0.08);
    --font-sans:  'Geist', system-ui, sans-serif;
    --font-serif: 'Instrument Serif', serif;
    --font-mono:  'Geist Mono', ui-monospace, monospace;
    --font-thai:  'Noto Sans Thai', 'Geist', sans-serif;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 1300px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-serif);
    font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.15;
    color: var(--color-ink);
    margin-bottom: 0.5rem;
  }
  .subtitle {
    font-family: var(--font-sans);
    font-size: 0.92rem;
    color: var(--color-muted);
    margin-bottom: 1.5rem;
    max-width: 760px;
  }
  svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">SKILL &middot; connecting-figma-flow-boards</p>
    <h1>What the agent does</h1>
    <p class="subtitle">Six steps, four checks. Blue is yours to do or decide.</p>

    <svg viewBox="140 70 1430 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="skill-steps-title skill-steps-desc">

      <desc id="skill-steps-desc">Flowchart of the connecting-figma-flow-boards skill: find a donor connector, connect the reference board or house pattern, then lay out and verify over REST, with four decision checks and two steps done by the person running the skill.</desc>

        </marker>

      <rect x="140" y="70" width="1430" height="800" fill="#f5f5f5"/>

      <!-- ===== Phase headers ===== -->
      <text x="350" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PHASE 1 &middot; FIND A DONOR</text>
      <text x="785" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PHASE 2 &middot; CONNECT</text>
      <text x="1370" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PHASE 3 &middot; LAY OUT AND VERIFY</text>

           ARROWS (drawn before nodes)
           ===================================================== -->

      <!-- Phase 1 main spine -->
      <line x1="275" y1="208" x2="275" y2="234" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="275" y1="372" x2="275" y2="398" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="360" y1="450" x2="380" y2="450" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="361" y="429" width="18" height="13" rx="3" fill="#f5f5f5"/>
      <text x="370" y="438" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">no</text>

      <!-- P1 loop back up into N2's right side -->
      <path d="M 400 422 L 400 344 L 340 344" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <text x="691" y="201" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">yes</text>

      <text x="880" y="201" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">no</text>

      <path d="M 955 240 L 955 272 L 791 272" fill="none" stroke="#4f5d75" stroke-width="1.2"/>

      <!-- N4 -> D3 -->
      <line x1="785" y1="338" x2="785" y2="364" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
