<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 150 1200 610" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="login-flow-title login-flow-desc">
      <title id="login-flow-title">Shop app login flow</title>
      <desc id="login-flow-desc">Flowchart showing a Figma Section of five login-flow screen frames joined by four cloned Connectors, with the Login screen as the focal entry point.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+Thai:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2563EB"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Section container (Figma Section) ===== -->
      <rect x="176" y="170" width="976" height="448" rx="12" fill="none" stroke="#7a8399" stroke-width="1.2" stroke-dasharray="6,4"/>
      <text x="192" y="196" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SECTION &#183; Shop app login &#183; 2210:5530</text>

      <!-- Gutter row labels -->
      <text x="160" y="293" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">SPINE ROW</text>
      <text x="160" y="517" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">VARIANT ROW</text>

      <!-- ===== Arrows (drawn before boxes) ===== -->
      <!-- 1. Login -> OTP -->
      <line x1="312" y1="290" x2="472" y2="290" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 2. OTP -> Choose shop -->
      <line x1="584" y1="290" x2="744" y2="290" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 3. Choose shop -> Home -->
      <line x1="856" y1="290" x2="1016" y2="290" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 4. Login -> Forgot password -->
      <line x1="256" y1="370" x2="256" y2="434" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels (Thai trigger text = the content, Noto Sans Thai, 12px, masks >=20px tall) -->
      <!-- Label 1 -->
      <rect x="332" y="258" width="120" height="24" rx="3" fill="#f5f5f5"/>
      <text x="392" y="274" fill="#4f5d75" font-size="12" font-family="'Noto Sans Thai','Geist',sans-serif" font-weight="500" text-anchor="middle">&#3585;&#3604; &#3648;&#3586;&#3657;&#3634;&#3626;&#3641;&#3656;&#3619;&#3632;&#3610;&#3610;</text>
      <!-- Label 2 -->
      <rect x="608" y="258" width="112" height="24" rx="3" fill="#f5f5f5"/>
      <text x="664" y="274" fill="#4f5d75" font-size="12" font-family="'Noto Sans Thai','Geist',sans-serif" font-weight="500" text-anchor="middle">&#3585;&#3619;&#3629;&#3585; OTP &#3588;&#3619;&#3610;</text>
      <!-- Label 3 -->
      <rect x="892" y="258" width="88" height="24" rx="3" fill="#f5f5f5"/>
      <text x="936" y="274" fill="#4f5d75" font-size="12" font-family="'Noto Sans Thai','Geist',sans-serif" font-weight="500" text-anchor="middle">&#3648;&#3621;&#3639;&#3629;&#3585;&#3619;&#3657;&#3634;&#3609;</text>
      <!-- Label 4 (vertical segment, label beside the line, 10px horizontal gap) -->
      <rect x="266" y="390" width="120" height="24" rx="3" fill="#f5f5f5"/>
      <text x="326" y="406" fill="#4f5d75" font-size="12" font-family="'Noto Sans Thai','Geist',sans-serif" font-weight="500" text-anchor="middle">&#3585;&#3604; &#3621;&#3639;&#3617;&#3619;&#3627;&#3633;&#3626;&#3612;&#3656;&#3634;&#3609;</text>

      <!-- ===== Nodes ===== -->
      <!-- Login (FOCAL) -->
      <rect x="200" y="210" width="112" height="160" rx="8" fill="#f5f5f5"/>
      <rect x="200" y="210" width="112" height="160" rx="8" fill="#2563eb" fill-opacity="0.08" stroke="#2563EB" stroke-width="1.4"/>
      <rect x="212" y="222" width="88" height="6" rx="2" fill="#2563EB" fill-opacity="0.18"/>
      <text x="256" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Login</text>
      <text x="256" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2210:5601</text>

      <!-- OTP -->
      <rect x="472" y="210" width="112" height="160" rx="8" fill="#f5f5f5"/>
      <rect x="472" y="210" width="112" height="160" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="484" y="222" width="88" height="6" rx="2" fill="#2d3142" fill-opacity="0.06"/>
      <text x="528" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OTP</text>
      <text x="528" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2210:5688</text>

      <!-- Choose shop -->
      <rect x="744" y="210" width="112" height="160" rx="8" fill="#f5f5f5"/>
      <rect x="744" y="210" width="112" height="160" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="756" y="222" width="88" height="6" rx="2" fill="#2d3142" fill-opacity="0.06"/>
      <text x="800" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Choose shop</text>
      <text x="800" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2210:5742</text>

      <!-- Home -->
      <rect x="1016" y="210" width="112" height="160" rx="8" fill="#f5f5f5"/>
      <rect x="1016" y="210" width="112" height="160" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="1028" y="222" width="88" height="6" rx="2" fill="#2d3142" fill-opacity="0.06"/>
      <text x="1072" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Home</text>
      <text x="1072" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2210:5810</text>

      <!-- Forgot password (variant row) -->
      <rect x="200" y="434" width="112" height="160" rx="8" fill="#f5f5f5"/>
      <rect x="200" y="434" width="112" height="160" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="212" y="446" width="88" height="6" rx="2" fill="#2d3142" fill-opacity="0.06"/>
      <text x="256" y="508" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Forgot password</text>
      <text x="256" y="524" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2210:5903</text>

      <!-- ===== Callouts (editorial, italic Instrument Serif, dashed leader) ===== -->
      <!-- Callout A -> edge 3 (any edge: the note is about every arrow) -->
      <text x="936" y="420" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">Each arrow is a CONNECTOR</text>
      <text x="936" y="436" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">cloned from one donor. Its</text>
      <text x="936" y="452" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">label is the trigger.</text>
      <path d="M 936 404 L 936 292" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="936" cy="290" r="2" fill="#2d3142"/>

      <!-- Callout B -> edge 4 -->
      <text x="380" y="440" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">A variant sits under the frame</text>
      <text x="380" y="456" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">it varies. Magnets BOTTOM -&gt; TOP,</text>
      <text x="380" y="472" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">re-set after layout.</text>
      <path d="M 378 434 Q 320 428 256 420" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="256" cy="420" r="2" fill="#2d3142"/>

      <!-- ===== Legend ===== -->
      <line x1="176" y1="642" x2="1152" y2="642" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
      <text x="176" y="662" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="176" y="679" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="196" y="688" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">box = screen frame</text>

      <line x1="176" y1="705" x2="188" y2="705" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="196" y="708" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">arrow = Connector (connectorStart / connectorEnd point at the two frames)</text>

      <rect x="176" y="719" width="12" height="12" rx="2" fill="#2563eb" fill-opacity="0.08" stroke="#2563EB" stroke-width="1.4"/>
      <text x="196" y="728" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">blue = entry screen</text>
    </svg>
